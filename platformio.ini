; drone-fr-spoofer
; Simulateur de signalement électronique français (arrêté 27/12/2019)
; Target: M5Stack Stamp S3 (ESP32-S3)

[platformio]
default_envs = m5stack-stamps3

[env:m5stack-stamps3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Les mêmes beacons en 802.11g OFDM à 6 Mbit/s : pio run -e m5stack-stamps3-ofdm -t upload
[env:m5stack-stamps3-ofdm]
extends = env:m5stack-stamps3
build_flags =
    ${env:m5stack-stamps3.build_flags}
    -DBEACON_OFDM=1

; Un drone sur deux dans chaque débit : pio run -e m5stack-stamps3-mixed -t upload
[env:m5stack-stamps3-mixed]
extends = env:m5stack-stamps3
build_flags =
    ${env:m5stack-stamps3.build_flags}
    -DBEACON_MIXED=1
