; drone-fr-spoofer
; Simulateur de signalement électronique français (arrêté 27/12/2019)
; Target: M5Stack Stamp S3 (ESP32-S3)

[env:m5stack-stamps3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
